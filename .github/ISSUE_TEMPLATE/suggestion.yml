name: Suggest an idea
description: A suggestion to improve the server.
labels: ["suggestion"]
body:
  - type: textarea
    id: idee
    attributes:
      label: Your idea
      description: What you are suggesting, and what it would bring to players.
    validations:
      required: true
  - type: textarea
    id: contexte
    attributes:
      label: Context
      description: Optional — what led you to suggest it, or how it works on other servers.
