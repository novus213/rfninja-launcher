name: Proposer une idée
description: Une suggestion pour améliorer le serveur.
labels: ["suggestion"]
body:
  - type: textarea
    id: idee
    attributes:
      label: Votre idée
      description: Ce que vous proposez, et ce que ça apporterait aux joueurs.
    validations:
      required: true
  - type: textarea
    id: contexte
    attributes:
      label: Contexte
      description: Optionnel — ce qui vous amène à le proposer, ou comment ça se passe sur d'autres serveurs.
